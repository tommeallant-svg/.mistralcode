version: '3.8'

services:
  # Web application service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-web-app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Data Web Application
      - APP_VERSION=1.0.0
      - APP_DEBUG=True
      - DATA_SOURCE=csv
      - CSV_DIRECTORY=/app/data/csv
      - UPLOAD_DIRECTORY=/app/data/uploads
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
    networks:
      - data-app-network
    restart: unless-stopped

  # PostgreSQL database service
  postgres:
    image: postgres:15-alpine
    container_name: data-web-app-postgres
    environment:
      - POSTGRES_DB=data_app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - data-app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PostgreSQL admin interface (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: data-web-app-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - data-app-network
    restart: unless-stopped

  # Nginx reverse proxy (optional for production)
  nginx:
    image: nginx:alpine
    container_name: data-web-app-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - data-app-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:

networks:
  data-app-network:
    driver: bridge
